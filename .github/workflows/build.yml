name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk FotoMail.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FotoMail-apk
          path: FotoMail.apk
      - name: Publish as release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FotoMail.apk \
            --title "Foto Mail (laatste versie)" \
            --notes "Automatisch gebouwd vanaf commit ${GITHUB_SHA::7}. Download FotoMail.apk op je telefoon en installeer."
